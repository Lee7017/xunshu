name: Visual review website

on:
  push:
    branches: [main]
    paths:
      - 'docs/.vitepress/theme/**'
      - 'docs/.vitepress/config.ts'
      - 'scripts/visual-review.mjs'
      - '.github/workflows/visual-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-review:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install VitePress and Playwright
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build preview with Pages base path
        env:
          SITE_BASE: /xunshu/
        run: npm run build
      - name: Screenshot and inspect site
        shell: bash
        env:
          PREVIEW_URL: http://127.0.0.1:4173/xunshu/
        run: |
          set -euo pipefail
          npx vitepress preview docs --host 127.0.0.1 --port 4173 > /tmp/xunshu-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4173/xunshu/; then break; fi
            sleep 1
          done
          node scripts/visual-review.mjs
      - name: Archive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xunshu-visual-review
          path: visual-review/
          if-no-files-found: warn
